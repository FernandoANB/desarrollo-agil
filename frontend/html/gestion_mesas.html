<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ocupación de mesas - Admin</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; background-color: #111; color: #fff;}
        .btn-release { padding: 10px; width: 100%; border: 2px solid #111; background: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px;}
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <i class="fa-solid fa-arrow-left" onclick="window.location.href='index.html'" style="cursor: pointer;"></i>
            <h2>ADMIN DASHBOARD</h2>
            <i class="fa-solid fa-gear"></i>
        </header>
        
        <main>
            <div class="card" style="background-color: #111; border-color: #111; margin-top: 20px; text-align: center;">
                <div class="card-header" style="color: #aaa; margin-bottom: 10px;"><span>Ocupación de Mesas</span></div>
                <h1 style="color: #fff; margin: 0; font-size: 3rem;">65% de Ocupación</h1>
                <p style="color: #aaa; margin: 5px 0 0;">Reservas Activas de Hoy</p>
            </div>

            
            <div id="reservas-lista">
                <p style="text-align: center; color: #666;">Cargando reservas...</p>
            </div>
        </main>
    </div>

    <script>
        async function cargarReservas() {
            try {
                const response = await fetch('http://localhost:8000/reservas/');
                const reservas = await response.json();
                const contenedor = document.getElementById('reservas-lista');
                contenedor.innerHTML = ''; 

                if(reservas.length === 0){
                    contenedor.innerHTML = '<p style="text-align:center;">No hay reservas activas en el sistema.</p>';
                    return;
                }

                reservas.forEach(reserva => {
                    if(reserva.estado === 'CONFIRMADA' || reserva.estado === 'PENDIENTE') {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <h2 style="margin:0; font-size:1.2rem; font-family: 'Inter', sans-serif;">Reserva #${reserva.id_reserva}</h2>
                                <span class="status-badge">OCUPADA</span>
                            </div>
                            <p style="margin:5px 0; color:#666;"><strong>Cliente:</strong> ${reserva.nombre_cliente} (${reserva.cantidad_personas} pers.)</p>
                            <p style="margin:5px 0; color:#666;"><strong>Hora:</strong> ${reserva.hora.substring(0, 5)}</p>
                            <button class="btn-release" onclick="liberarMesa(${reserva.id_reserva})">Liberar Mesa</button>
                        `;
                        contenedor.appendChild(card);
                    }
                });
            } catch (error) {
                document.getElementById('reservas-lista').innerHTML = '<p style="text-align:center; color:red;">Error de conexión con el servidor.</p>';
            }
        }

        async function liberarMesa(id_reserva) {
            try {
                const response = await fetch(`http://localhost:8000/reservas/${id_reserva}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ estado: 'FINALIZADA' })
                });

                if (response.ok) { cargarReservas(); }
            } catch (error) { alert('Error al intentar liberar la mesa.'); }
        }

        cargarReservas();
    </script>
</body>
</html>
