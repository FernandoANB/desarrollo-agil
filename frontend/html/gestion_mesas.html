<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ocupación en Vivo - Admin</title>
    <link rel="stylesheet" href="../css/reservar_mesa.css">
    <style>
        .dashboard-header { background-color: #111; color: #f8f8f8; padding: 25px; border-radius: 12px; text-align: center; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);}
        .dashboard-header h1 { font-size: 3rem; margin: 10px 0;}
        .table-card { background-color: #fff; border: 1px solid #eaeaea; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);}
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;}
        .table-header h2 { margin: 0; font-size: 1.2rem; }
        .status-badge { padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; letter-spacing: 1px;}
        .status-occupied { background-color: #111; color: #fff;}
        .btn-action { width: 100%; padding: 12px; margin-top: 15px; font-weight: bold; background-color: #111; color: #fff; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s;}
        .btn-release { background-color: #fff; color: #111; border: 2px solid #111;}
    </style>
</head>
<body>
    <nav><h2>PANEL DE ADMINISTRACIÓN</h2></nav>
    <main class="container">
        <div class="dashboard-header">
            <p>OCUPACIÓN EN VIVO</p>
            <h1>65% Lleno</h1>
            <p>Reservas Activas de Hoy</p>
        </div>

        <h3 style="margin-bottom: 15px;">Vista de Salón</h3>
        
        <div id="reservas-lista">
            <p style="text-align: center; color: #666;">Cargando reservas desde el servidor...</p>
        </div>
    </main>

    <script>
        async function cargarReservas() {
            try {
                const response = await fetch('http://localhost:8000/reservas/');
                const reservas = await response.json();
                const contenedor = document.getElementById('reservas-lista');
                contenedor.innerHTML = ''; 

                if(reservas.length === 0){
                    contenedor.innerHTML = '<p style="text-align:center;">No hay reservas activas en el sistema.</p>';
                    return;
                }

                reservas.forEach(reserva => {
                    if(reserva.estado === 'CONFIRMADA' || reserva.estado === 'PENDIENTE') {
                        const card = document.createElement('div');
                        card.className = 'table-card';
                        card.innerHTML = `
                            <div class="table-header">
                                <h2>Reserva #${reserva.id_reserva}</h2>
                                <span class="status-badge status-occupied">OCUPADA</span>
                            </div>
                            <p><strong>Cliente:</strong> ${reserva.nombre_cliente} (${reserva.cantidad_personas} pers.)</p>
                            <p><strong>Hora:</strong> ${reserva.hora}</p>
                            <p><small><strong>Notas:</strong> ${reserva.notas || 'Ninguna'}</small></p>
                            <button class="btn-action btn-release" onclick="liberarMesa(${reserva.id_reserva})">Liberar Mesa</button>
                        `;
                        contenedor.appendChild(card);
                    }
                });
            } catch (error) {
                contenedor.innerHTML = '<p style="text-align:center; color:red;">Error de conexión con el servidor.</p>';
            }
        }

        async function liberarMesa(id_reserva) {
            try {
                const response = await fetch(`http://localhost:8000/reservas/${id_reserva}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ estado: 'FINALIZADA' })
                });

                if (response.ok) {
                    cargarReservas(); // Recargar la lista sin recargar la página
                }
            } catch (error) {
                alert('Error al intentar liberar la mesa.');
            }
        }

        cargarReservas();
    </script>
</body>
</html>
