<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Detalles de Reserva</title>
    <link rel="stylesheet" href="../css/detalles_reserva.css">
</head>
<body>
    <nav>
        <h2>Julio Cesar Restaurant</h2>
    </nav>
    <main class="container">
        <h1>Completa Tu Reserva</h1>
        <p>Por favor, ingresa tus datos de contacto para asegurar tu mesa.</p>
        
        <form id="form-paso-2"> 
            <div class="input-group">
                <label>NOMBRE COMPLETO</label>
                <input type="text" id="nombre" placeholder="Ej. Julio Cesar" required>
            </div>
            
            <div class="input-group">
                <label>CORREO ELECTRÓNICO</label>
                <input type="email" id="email" placeholder="correo@ejemplo.com" required>
            </div>
            
            <div class="input-group">
                <label>NÚMERO DE TELÉFONO</label>
                <input type="tel" id="telefono" placeholder="+56 9 0000 0000" required>
            </div>
            
            <div class="input-group">
                <label>PETICIONES ESPECIALES (Opcional)</label>
                <textarea id="notas" rows="3" placeholder="Alergias, silla de bebé, aniversarios..."></textarea>
            </div>
            
            <button type="submit" id="btn-submit" class="btn-submit">CONFIRMAR RESERVA</button>
        </form>
    </main>
    <script src="../js/paso2.js"></script>
</body>
</html>
