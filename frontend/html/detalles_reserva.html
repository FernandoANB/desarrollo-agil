<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Detalles de Reserva</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/reservar_mesa.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <i class="fa-solid fa-arrow-left" onclick="history.back()"></i>
            <h2>RESERVE & REFINE</h2>
            <i class="fa-regular fa-circle-user"></i>
        </header>
        
        <main>
            <h1>Complete Your Details</h1>
            <p class="subtitle">Please provide your contact details to secure your table.</p>
            
            <form id="form-paso-2"> 
                <div class="card">
                    <div class="card-header"><span>CONTACT INFO</span></div>
                    <input type="text" id="nombre" placeholder="Full Name (ej. Julio Cesar)" required>
                    <input type="email" id="email" placeholder="Email Address" required style="margin-top: 15px;">
                    <input type="tel" id="telefono" placeholder="Phone Number" required style="margin-top: 15px;">
                </div>
                
                <div class="card">
                    <div class="card-header"><span>SPECIAL REQUESTS / NOTES</span></div>
                    <textarea id="notas" rows="3" placeholder="Allergies, anniversaries, baby chairs..."></textarea>
                </div>
                
                <div class="bottom-action">
                    <button type="submit" id="btn-submit" class="btn-main">
                        CONFIRM RESERVATION <i class="fa-solid fa-check"></i>
                    </button>
                </div>
            </form>
        </main>
    </div>
    <script src="../js/paso2.js"></script>
</body>
</html>
