<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julio Cesar Restaurant</title>
    <link rel="stylesheet" href="../css/detalles_reserva.css">
</head>
<body>
    <nav>
        <h2>Julio Cesar Restaurant</h2>
    </nav>
    <div class="container">
        <h1>Completa Tu Reserva</h1>
        <p>Por favor, completa tus datos de contacto para 
            terminar de reservar tu mesa.</p>
        <form>
            <div class="nombre">
                <label>Nombre Completo</label>
                <input type="text" placeholder="Julio Cesar">
            </div>
            <hr>
            <div class="rut">
                <label>RUT</label>
                <input type="text" placeholder="13355879-k">
            </div>
            <hr>
            <div class="email">
                <label>Email</label>
                <input type="email" placeholder="j.cesar@gmail.com">
            </div>
            <hr>
            <div class="telefono">
                <label>Número de Teléfono</label>
                <input type="text" placeholder="939027863">
            </div>
            <hr>
            <div class="notas">
                <label>Peticiones Especiales / Nota</label>
                <textarea placeholder="Alergias, aniversarios, sillas de bebe, etc."></textarea>
            </div>
            <div class="boton">
                <button type="submit" class="btn-submit">CONFIRMAR RESERVA</button>
            </div>
        </form>
    </div>
</body>
</html>
