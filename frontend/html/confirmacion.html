<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julio Cesar Restaurant</title>
    <link rel="stylesheet" href="../css/confirmacion.css">
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav>
        <h2>Julio Cesar Restaurant</h2>
    </nav>
    <div class="container">
        <div class="titulo">
            <h1>Tu reserva ha sido confirmada, Julio Cesar.</h1>
        </div>
        <div class="fecha">
            <h3>FECHA Y HORA</h3>
            <div class="fecha-content">
                <i class="fa-solid fa-calendar"></i>
                <h2>Sábado, 25 Junio - 19:00 PM</h2>
            </div>
        </div>
        <div class="invitados">
            <h3>INVITADOS</h3>
            <div class="invitados-content">
                <i class="fa-solid fa-person"></i>
                <h2>4 Invitados</h2>
            </div>
        </div>
        <div class="email">
            <hr>
            <div class="email-content">
                <i class="fa-solid fa-envelope"></i>
                <p>Hemos enviado una copia de tu reserva a tu email.</p>
            </div>
        </div>
    </div>
    <a href="reservar_mesa.html" class="btn-volver">ATRÁS</a>
</body>
</html>
